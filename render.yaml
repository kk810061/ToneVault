services:
  - type: web
    name: tonevault-backend
    env: node
    rootDir: backend
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 5000
      - key: FRONTEND_URL
        sync: false # Add your Vercel frontend URL here
      - key: MONGO_URI
        sync: false # Add your MongoDB connection string here
      - key: JWT_SECRET
        sync: false # Add your JWT Secret here
